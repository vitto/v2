# The specs, on every pull request and on main: of the scripts, and of the plugin as it ships
# (scripts/plugin.spec.ts: every skill's frontmatter parses, the manifests). The check
# /v2:work-merge waits for (GOVERNANCE.md rule 1: a merge needs its checks green).
# No dependency to install.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
